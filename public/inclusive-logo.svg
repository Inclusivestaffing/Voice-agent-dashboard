<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="brand-logo-svg">
  <!-- Checkmark Icon -->
  <g class="logo-mark">
    <!-- Amber checkmark arm -->
    <path d="M12 36 L24 48 L52 14" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Obsidian solid pillar -->
    <rect x="20" y="30" width="8" height="26" rx="4" fill="#0F172A"/>
  </g>
  <!-- Wordmark -->
  <text x="66" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1.5" fill="#0F172A">INCLUSIVE</text>
  <text x="66" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1.5" fill="#0F172A">STAFFING</text>
  <rect x="180" y="20" width="86" height="20" rx="10" fill="#FEF3C7"/>
  <text x="223" y="34" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="0.8" fill="#B45309" text-anchor="middle">ONBOARDING</text>
</svg>
